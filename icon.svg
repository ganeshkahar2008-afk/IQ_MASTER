<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02051c"/>
      <stop offset="50%" stop-color="#071b66"/>
      <stop offset="100%" stop-color="#02051c"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00eaff"/>
      <stop offset="1" stop-color="#0066ff"/>
    </linearGradient>

    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4cff"/>
      <stop offset="1" stop-color="#8a00ff"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff900"/>
      <stop offset="0.55" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#ff7100"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="7"
                    flood-color="#000000" flood-opacity=".8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="70" fill="url(#bg)"/>

  <!-- Neon border -->
  <rect x="16" y="16" width="480" height="480"
        rx="65"
        fill="none"
        stroke="url(#blue)"
        stroke-width="8"
        filter="url(#glow)"/>

  <!-- Brain -->
  <g filter="url(#glow)">
    <path d="M250 82
             C218 55 176 77 177 112
             C145 110 128 139 141 166
             C111 180 116 222 143 235
             C130 270 158 294 190 287
             C203 316 239 309 256 283
             L256 105 Z"
          fill="url(#blue)"
          stroke="#63f7ff"
          stroke-width="5"/>

    <path d="M262 105
             C278 72 321 69 337 100
             C369 93 390 121 377 148
             C404 164 398 204 375 218
             C391 251 364 282 332 275
             C319 307 282 303 262 280 Z"
          fill="url(#pink)"
          stroke="#ff8cff"
          stroke-width="5"/>

    <path d="M256 88 L256 285"
          stroke="#ffffff"
          stroke-width="5"
          opacity=".8"/>

    <path d="M188 135 C220 113 232 145 207 157
             M170 190 C202 168 220 198 193 212
             M306 130 C282 110 273 142 298 153
             M343 186 C315 168 294 196 320 210"
          fill="none"
          stroke="#b9ffff"
          stroke-width="9"
          stroke-linecap="round"/>
  </g>

  <!-- Puzzle blocks -->
  <g filter="url(#shadow)">
    <rect x="48" y="105" width="65" height="65" rx="13"
          fill="url(#blue)" stroke="#7dfaff" stroke-width="4"/>
    <rect x="108" y="62" width="65" height="65" rx="13"
          fill="url(#blue)" stroke="#7dfaff" stroke-width="4"/>

    <rect x="399" y="62" width="65" height="65" rx="13"
          fill="url(#gold)" stroke="#fff58a" stroke-width="4"/>
    <rect x="420" y="105" width="65" height="65" rx="13"
          fill="url(#gold)" stroke="#fff58a" stroke-width="4"/>

    <rect x="48" y="275" width="65" height="65" rx="13"
          fill="#20ef32" stroke="#8cff91" stroke-width="4"/>
    <rect x="105" y="235" width="65" height="65" rx="13"
          fill="#20ef32" stroke="#8cff91" stroke-width="4"/>

    <rect x="399" y="235" width="65" height="65" rx="13"
          fill="url(#pink)" stroke="#ff9aff" stroke-width="4"/>
    <rect x="420" y="275" width="65" height="65" rx="13"
          fill="#ff4545" stroke="#ff9b9b" stroke-width="4"/>
  </g>

  <!-- IQ -->
  <text x="256" y="375"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="150"
        font-weight="900"
        fill="url(#gold)"
        stroke="#07113d"
        stroke-width="12"
        paint-order="stroke"
        filter="url(#shadow)">IQ</text>

  <!-- MASTER -->
  <text x="256" y="435"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-size="55"
        font-weight="900"
        letter-spacing="2"
        fill="white"
        stroke="#07113d"
        stroke-width="7"
        paint-order="stroke">MASTER</text>

  <!-- Bottom label -->
  <rect x="105" y="452" width="302" height="35"
        rx="17"
        fill="#061337"
        stroke="#00eaff"
        stroke-width="3"/>

  <text x="256" y="477"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        letter-spacing="3"
        fill="#55f6ff">BRAIN BLOCKS</text>

</svg>
