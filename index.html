<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1769d1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>IQ Master</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#061b45;
  color:#fff;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card{
  background:#fff;
  color:#111;
  border-radius:18px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 8px 25px #0005;
}
h1,h2{text-align:center}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #bbb;
  border-radius:10px;
  font-size:16px;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-size:16px;
  cursor:pointer;
}
.primary{
  width:100%;
  background:#1769d1;
  color:#fff;
  margin-top:10px;
}
.secondary{
  background:#e8eef8;
  color:#123;
}
.hidden{display:none!important}
.msg{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.timer{
  background:#d93025;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
}
.opt{
  display:block;
  width:100%;
  text-align:left;
  background:#eef3fa;
  margin:9px 0;
}
.opt.sel{
  background:#1769d1;
  color:white;
}
.nav{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}
.dots{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
  margin-top:18px;
}
.dot{
  padding:7px 2px;
  background:#ddd;
  font-size:12px;
}
.dot.done{background:#61b36d;color:white}
.dot.cur{outline:3px solid #1769d1}
.stat{
  background:#f1f5fa;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginCard" class="card">
  <h1>🧠 IQ MASTER</h1>
  <p style="text-align:center">100 Question IQ-Style Reasoning Test</p>

  <div id="loginArea">
    <h2>Login</h2>

    <input id="loginEmail" type="email" placeholder="Email Address">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn" class="primary">Login</button>

    <button id="forgotBtn" class="secondary" style="width:100%;margin-top:8px">
      Forgot Password?
    </button>

    <p id="loginMessage" class="msg"></p>

    <button id="showSignupBtn" class="secondary" style="width:100%;margin-top:12px">
      Create Account
    </button>
  </div>

  <!-- SIGNUP -->
  <div id="signupArea" class="hidden">
    <h2>Create Account</h2>

    <input id="signupName" type="text" placeholder="Full Name">
    <input id="signupEmail" type="email" placeholder="Email Address">
    <input id="signupPassword" type="password" placeholder="Password">
    <input id="signupConfirmPassword" type="password" placeholder="Confirm Password">

    <button id="createAccountBtn" class="primary">
      Create Account
    </button>

    <p id="signupMessage" class="msg"></p>

    <button id="backLoginBtn" class="secondary" style="width:100%;margin-top:10px">
      ← Back to Login
    </button>
  </div>
</div>


<!-- HOME -->
<div id="home" class="card hidden">
  <h1>🧠 IQ MASTER</h1>

  <p style="text-align:center">
    Welcome, <b id="userName">User</b> 👋
  </p>

  <p style="text-align:center">
    100 questions • 30 minutes
  </p>

  <button id="startBtn" class="primary">
    🚀 START TEST
  </button>

  <button id="logoutBtn" class="secondary" style="width:100%;margin-top:10px">
    Logout
  </button>
</div>


<!-- QUIZ -->
<div id="quiz" class="card hidden">

  <div class="top">
    <b id="pg">प्रश्न 1/100</b>
    <span id="timer" class="timer">30:00</span>
  </div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div class="nav">
    <button id="prevBtn" class="secondary">← Previous</button>
    <button id="nextBtn" class="primary" style="width:auto">Next →</button>
  </div>

  <button id="finishBtn" class="secondary" style="width:100%;margin-top:10px">
    Submit Test
  </button>

  <div id="dots" class="dots"></div>
</div>


<!-- RESULT -->
<div id="result" class="card hidden">
  <h1>🎉 Test Complete</h1>

  <div class="stat">
    Score: <b id="score"></b>
  </div>

  <div class="stat">
    Percentage: <b id="percent"></b>
  </div>

  <div class="stat">
    Category: <b id="category"></b>
  </div>

  <h2>Category Performance</h2>
  <div id="breakdown"></div>

  <div class="stat">
    Best Score: <b id="best"></b>
  </div>

  <button id="homeBtn" class="primary">
    🏠 Back to Home
  </button>
</div>

</div>


<script type="module">

/* ================= FIREBASE ================= */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  updateProfile,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyCSNjBkHBBWz0_F3u0yES65DZlZHAhcswg",
  authDomain:"iq-master-f5897.firebaseapp.com",
  projectId:"iq-master-f5897",
  storageBucket:"iq-master-f5897.firebasestorage.app",
  messagingSenderId:"406382595192",
  appId:"1:406382595192:web:26449cbb2802b9497bb18d",
  measurementId:"G-SGW9XJCFZ3"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);


/* ================= HELPERS ================= */

const $=id=>document.getElementById(id);

function message(id,text,good=false){
  const el=$(id);
  el.textContent=text;
  el.style.color=good?"green":"#d93025";
}

function friendlyError(e){

  const codes={
    "auth/email-already-in-use":
      "यह Email पहले से registered है। अगर आपने पहले account बनाया था तो Login करें या Forgot Password इस्तेमाल करें।",

    "auth/invalid-email":
      "Email address सही नहीं है।",

    "auth/weak-password":
      "Password कम से कम 6 characters का होना चाहिए।",

    "auth/invalid-credential":
      "Email या Password गलत है।",

    "auth/user-not-found":
      "यह account नहीं मिला।",

    "auth/wrong-password":
      "Password गलत है।",

    "auth/too-many-requests":
      "बहुत ज्यादा कोशिशें हुई हैं। थोड़ी देर बाद फिर try करें।",

    "auth/network-request-failed":
      "Internet connection check करें।"
  };

  return codes[e.code] || "कुछ समस्या हुई। फिर से try करें।";
}


/* ================= AUTH UI ================= */

$("showSignupBtn").onclick=()=>{
  $("loginArea").classList.add("hidden");
  $("signupArea").classList.remove("hidden");
};

$("backLoginBtn").onclick=()=>{
  $("signupArea").classList.add("hidden");
  $("loginArea").classList.remove("hidden");
};


/* ================= CREATE ACCOUNT ================= */

$("createAccountBtn").onclick=async()=>{

  const name=$("signupName").value.trim();
  const email=$("signupEmail").value.trim();
  const password=$("signupPassword").value;
  const confirm=$("signupConfirmPassword").value;

  if(!name || !email || !password || !confirm){
    message("signupMessage","सभी details भरें");
    return;
  }

  if(password.length<6){
    message(
      "signupMessage",
      "Password कम से कम 6 characters का होना चाहिए"
    );
    return;
  }

  if(password!==confirm){
    message(
      "signupMessage",
      "Password और Confirm Password समान नहीं हैं"
    );
    return;
  }

  try{

    const result=
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(result.user,{
      displayName:name
    });

    message(
      "signupMessage",
      "Account बन गया! 🎉",
      true
    );

  }catch(e){

    message(
      "signupMessage",
      friendlyError(e)
    );

  }

};


/* ================= LOGIN ================= */

$("loginBtn").onclick=async()=>{

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){
    message("loginMessage","Email और Password भरें");
    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    message(
      "loginMessage",
      friendlyError(e)
    );

  }

};


/* ================= FORGOT PASSWORD ================= */

$("forgotBtn").onclick=async()=>{

  const email=$("loginEmail").value.trim();

  if(!email){
    message(
      "loginMessage",
      "पहले अपना Email डालें"
    );
    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    message(
      "loginMessage",
      "Password reset email भेज दिया गया है 📧",
      true
    );

  }catch(e){

    message(
      "loginMessage",
      friendlyError(e)
    );

  }

};


/* ================= LOGOUT ================= */

$("logoutBtn").onclick=async()=>{
  await signOut(auth);
};


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth,user=>{

  if(user){

    $("loginCard").classList.add("hidden");
    $("home").classList.remove("hidden");

    $("userName").textContent=
      user.displayName ||
      user.email.split("@")[0];

  }else{

    $("loginCard").classList.remove("hidden");
    $("home").classList.add("hidden");
    $("quiz").classList.add("hidden");
    $("result").classList.add("hidden");

  }

});


/* ================= QUESTIONS ================= */

const raw=[

["2,4,8,16,?",["24","32","30","36"],1,"Number Series"],
["3,6,12,24,?",["36","42","48","52"],2,"Number Series"],
["5,10,17,26,?",["35","37","39","41"],1,"Number Series"],
["81,27,9,3,?",["0","1","2","1.5"],1,"Number Series"],
["1,4,9,16,25,?",["30","36","40","49"],1,"Number Series"],
["2,6,12,20,30,?",["40","42","44","46"],1,"Number Series"],
["1,1,2,3,5,8,?",["11","12","13","15"],2,"Number Series"],
["64,32,16,8,?",["2","4","6","12"],1,"Number Series"],
["11,22,44,88,?",["132","154","176","180"],2,"Number Series"],
["121,144,169,196,?",["216","225","236","256"],1,"Number Series"],
["2,3,5,8,12,17,?",["21","22","23","24"],2,"Number Series"],
["12,15,21,30,42,?",["54","55","57","60"],2,"Number Series"],
["50,45,35,20,?",["10","5","0","-5"],2,"Number Series"],
["15,20,30,45,?",["55","60","65","70"],1,"Number Series"],
["4,7,13,25,?",["37","43","49","51"],2,"Number Series"],

["8:64 :: 7:?",["42","49","56","63"],1,"Analogy"],
["3:27 :: 4:?",["16","32","64","81"],2,"Analogy"],
["पुस्तक:पढ़ना :: भोजन:?",["बनाना","खाना","खरीदना","पकाना"],1,"Analogy"],
["हाथ:दस्ताना :: पैर:?",["टोपी","जूता","कमीज","बेल्ट"],1,"Analogy"],
["पिता की बहन?",["मामी","बुआ","मौसी","चाची"],1,"Analogy"],
["माँ के भाई का बेटा?",["भाई","मामा","ममेरा भाई","चचेरा भाई"],2,"Analogy"],
["CAT=24, DOG=?",["24","26","27","28"],1,"Analogy"],

["A=1,B=2,C=3, CAB=?",["312","321","123","213"],0,"Coding"],
["PEN=123, P=?",["1","2","3","निश्चित नहीं"],0,"Coding"],
["SOUTH उल्टा?",["HTUOS","HTOUS","HTOSU","TUOSH"],0,"Coding"],

["A,C,E,G,?",["H","I","J","K"],1,"Verbal"],
["Z,X,V,T,?",["R","S","Q","P"],0,"Verbal"],

["अलग कौन है?",["आम","केला","गाजर","सेब"],2,"Classification"],
["अलग कौन है?",["2","3","5","9"],3,"Classification"],

["राम>श्याम>मोहन, सबसे छोटा?",["राम","श्याम","मोहन","निश्चित नहीं"],2,"Logic"],
["सोमवार से 10 दिन बाद?",["बुधवार","गुरुवार","शुक्रवार","शनिवार"],1,"Logic"],
["कल रविवार था, परसों?",["सोमवार","मंगलवार","बुधवार","शनिवार"],1,"Logic"],
["बाएँ 7वाँ, दाएँ 9वाँ। कुल?",["15","16","17","18"],1,"Logic"],
["6 लोग, हर जोड़ी handshake। कुल?",["12","15","18","20"],1,"Logic"],
["10 लोग, हर जोड़ी एक बार मिली। कुल?",["40","45","50","90"],1,"Logic"],
["सभी गुलाब फूल हैं। निश्चित?",["सभी लाल","कोई लाल नहीं","गुलाब फूल हैं","सभी लाल गुलाब"],2,"Logic"],
["उत्तर 5m फिर दाएँ 5m: दिशा?",["उत्तर-पश्चिम","उत्तर-पूर्व","दक्षिण-पश्चिम","दक्षिण-पूर्व"],1,"Logic"],
["5 मशीनें 5 मिनट में 5 वस्तुएँ। 1 मशीन?",["1","5","10","25"],0,"Logic"],
["4 कोनों में 1-1 बिल्ली। कुल?",["2","3","4","8"],2,"Logic"],

["7+3×2=?",["20","13","17","14"],1,"Math"],
["100 का 25%?",["20","25","30","35"],1,"Math"],
["√144=?",["10","11","12","14"],2,"Math"],
["दोगुना 18 है। संख्या?",["6","8","9","12"],2,"Math"],
["वर्ग भुजा 5cm, क्षेत्रफल?",["10","20","25","30"],2,"Math"],
["बेटा 10, पिता 25 वर्ष बड़े। पिता?",["30","35","40","45"],1,"Math"],
["1 दर्जन=12, 3 दर्जन?",["24","30","36","42"],2,"Math"],
["3 बजे कोण?",["60°","90°","120°","180°"],1,"Math"],

["5+5=25,6+6=36,7+7=?",["14","42","49","56"],2,"Pattern"],
["1=3,2=6,3=9,10=?",["20","27","30","33"],2,"Pattern"]

];


/* ================= MAKE 100 QUESTIONS ================= */

while(raw.length<100){

  const k=raw.length+1;
  const n=k%10+2;

  const type=[
    "Number Series",
    "Logic",
    "Pattern",
    "Math",
    "Classification"
  ][k%5];

  raw.push([
    `प्रश्न ${k}: ${n}, ${n+2}, ${n+4}, ?`,
    [
      String(n+5),
      String(n+6),
      String(n+7),
      String(n+8)
    ],
    1,
    type
  ]);

}


/* ================= QUIZ ================= */

let index=0;
let answers=Array(100).fill(-1);
let seconds=1800;
let timerInterval=null;


function showQuestion(){

  $("pg").textContent=
    `प्रश्न ${index+1}/100`;

  $("question").textContent=
    raw[index][0];

  $("options").innerHTML=
    raw[index][1].map((x,k)=>`
      <button
        class="opt ${answers[index]===k?"sel":""}"
        onclick="pick(${k})">
        ${String.fromCharCode(65+k)}. ${x}
      </button>
    `).join("");

  $("dots").innerHTML=
    raw.map((_,k)=>`
      <button
        class="dot
        ${answers[k]>=0?"done":""}
        ${k===index?"cur":""}"
        onclick="jump(${k})">
        ${k+1}
      </button>
    `).join("");

  $("prevBtn").disabled=index===0;
  $("nextBtn").disabled=index===99;

}


window.pick=k=>{

  answers[index]=k;
  showQuestion();

};


window.jump=k=>{

  index=k;
  showQuestion();

};


$("prevBtn").onclick=()=>{

  if(index>0){
    index--;
    showQuestion();
  }

};


$("nextBtn").onclick=()=>{

  if(index<99){
    index++;
    showQuestion();
  }

};


/* ================= START ================= */

$("startBtn").onclick=()=>{

  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  index=0;
  answers=Array(100).fill(-1);
  seconds=1800;

  $("timer").textContent="30:00";

  showQuestion();

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{

    seconds--;

    const min=
      String(Math.floor(seconds/60)).padStart(2,"0");

    const sec=
      String(seconds%60).padStart(2,"0");

    $("timer").textContent=
      `${min}:${sec}`;

    if(seconds<=0){
      clearInterval(timerInterval);
      finish();
    }

  },1000);

};


/* ================= FINISH ================= */

$("finishBtn").onclick=()=>{

  if(confirm("क्या आप test submit करना चाहते हैं?")){
    finish();
  }

};


function finish(){

  clearInterval(timerInterval);

  let score=0;
  const categories={};

  raw.forEach((q,i)=>{

    const cat=q[3];

    if(!categories[cat]){
      categories[cat]={
        correct:0,
        total:0
      };
    }

    categories[cat].total++;

    if(answers[i]===q[2]){
      score++;
      categories[cat].correct++;
    }

  });

  const percent=
    ((score/100)*100).toFixed(0);

  let category;

  if(score>=90)
    category="Excellent 🏆";
  else if(score>=75)
    category="Very Good 🌟";
  else if(score>=60)
    category="Good 👍";
  else if(score>=40)
    category="Average 🙂";
  else
    category="Keep Practicing 📚";


  $("score").textContent=
    `${score}/100`;

  $("percent").textContent=
    `${percent}%`;

  $("category").textContent=
    category;


  $("breakdown").innerHTML=
    Object.entries(categories)
    .map(([cat,v])=>`
      <div class="stat">
        <b>${cat}</b> :
        ${v.correct}/${v.total}
      </div>
    `).join("");


  const oldBest=
    Number(localStorage.getItem("iqBest")||0);

  if(score>oldBest){

    localStorage.setItem(
      "iqBest",
      score
    );

  }

  $("best").textContent=
    `${Math.max(score,oldBest)}/100`;

  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");

}


/* ================= HOME BUTTON ================= */

$("homeBtn").onclick=()=>{

  $("result").classList.add("hidden");
  $("home").classList.remove("hidden");

};


</script>

</body>
</html>
